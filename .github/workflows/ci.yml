name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: HA ${{ matrix.home_assistant }} (${{ matrix.support }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home_assistant: "2026.9.0"
            ha_test_helper: "0.13.363"
            support: minimum
          - home_assistant: "2026.9.1"
            ha_test_helper: "0.13.364"
            support: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned validation environment
        run: >-
          python -m pip install
          homeassistant==${{ matrix.home_assistant }}
          pytest-homeassistant-custom-component==${{ matrix.ha_test_helper }}
          jsonschema==4.26.0 mypy==2.3.1 pytest==9.0.3
          pytest-cov==7.1.0 ruff==0.16.7
      - name: Static checks
        if: matrix.support == 'minimum'
        run: |
          ruff check .
          ruff format --check custom_components tests tools
          mypy
      - name: Full repository validation
        run: PYTHONPATH=. pytest --cov=custom_components/athb --cov-branch --cov-fail-under=95
      - name: Build deterministic distribution
        run: python tools/build_release.py

  hacs:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@22.5.0
        with:
          category: integration
