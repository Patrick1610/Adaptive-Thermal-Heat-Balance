[dependency-groups]
test = [
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
]
ha = [
    "homeassistant==2026.9.0",
    "pytest-homeassistant-custom-component==0.13.363",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components.athb"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["custom_components/athb", "tools/oracle/generate_athb_fixtures.py"]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pythermalcomfort.*"]
ignore_missing_imports = true
